<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Titan PM Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #f8fafc;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.92);
        padding: 2rem;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 1.5rem;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Titan PM is offline</h1>
      <p>The app shell is available after your first visit, but this request could not be completed without a network connection.</p>
      <a href="/">Try opening the dashboard</a>
    </main>
  </body>
</html>
